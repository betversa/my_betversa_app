name: Daily Player Stats Update

on:
  schedule:
    - cron: '0 0 * * *'  # Runs once a day at midnight UTC
  workflow_dispatch: {}  # Allows manual triggering

jobs:
  update-player-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLB Pitcher Stats Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scripts/mlbpitcherstats.py

      - name: Run MLB Batter Stats Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scripts/mlbbatterstats.py

      - name: Run NBA Player Stats Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scripts/nbaplayerstats.py

      - name: Run NHL Skater Stats Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scripts/nhlskatestats.py

      - name: Commit updated JSON files to GitHub
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add data/mlb_batter_stats_2025_pretty.json data/mlb_pitcher_stats_2025_pretty.json data/nba_stats_2025_pretty.json data/nhl_skater_stats_2025_pretty.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
            git commit -m "🔁 Auto-update odds data — ${TIMESTAMP}"
            # Pull the remote changes and rebase your commit onto them.
            git pull --rebase origin main
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

